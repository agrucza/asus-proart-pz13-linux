# ASUS ProArt PZ13: USB-C DisplayPort audio devices for the HiFi verb. OPT-IN.
#
# Append this file to /usr/share/alsa/ucm2/Qualcomm/x1e80100/ProArt-PZ13-HiFi.conf and
# add the two csets below to the verb's EnableSequence (PipeWire opens every PCM of the
# verb when it builds the profile, so the routes must be on at verb level):
#     cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 1"
#     cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 1"
# and install install/wireplumber-20-dp-audio.conf. Needs patches/0010 (DP PCMs can be
# opened while no monitor is attached) and the topology with the DisplayPort streams.
#
# Known quirk (notes/dp-audio-hotplug.md): the DSP refuses the first start of port 0
# after a boot; the stream then waits until the output is switched to the speakers and
# back once. Keep the sound-settings window closed when unplugging: its level meters keep
# the sink open past the driver's wait. Opt-in because of the quirk.

SectionDevice."HDMI0" {
	Comment "USB-C port 0 DisplayPort playback"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		JackControl "DP0 Jack"
	}
}

SectionDevice."HDMI1" {
	Comment "USB-C port 1 DisplayPort playback"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},3"
		JackControl "DP1 Jack"
	}
}
