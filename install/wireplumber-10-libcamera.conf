# ASUS ProArt PZ13: WirePlumber configuration for the cameras.
# Install as ~/.config/wireplumber/wireplumber.conf.d/10-libcamera.conf (or under
# /etc/wireplumber/wireplumber.conf.d/).
#
# 1. Enable the libcamera monitor (Debian's default leaves the cameras invisible to
#    PipeWire; only the raw CAMSS V4L2 nodes show up).
# 2. Both sensors report themselves as "front", so PipeWire names both "Internal front
#    camera", and apps such as GNOME Snapshot take the first camera in their list, which
#    varies per boot because the two CCI buses probe in parallel. On boots where the IR
#    sensor comes first they fail with "not-negotiated": its only format is 10-bit mono,
#    which no desktop app can display. Name the colour camera by its stable device path and
#    hide the IR camera from PipeWire (face-unlock tools read it via V4L2/libcamera directly).
wireplumber.profiles = {
  main = {
    monitor.libcamera = required
  }
}

monitor.libcamera.rules = [
  {
    matches = [
      {
        node.name = "~libcamera_input.*"
        object.path = "~libcamera:.*camera@36"
      }
    ]
    actions = {
      update-props = {
        node.description = "PZ13 front camera"
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~libcamera_input.*"
        object.path = "~libcamera:.*camera@24"
      }
    ]
    actions = {
      update-props = {
        node.description = "PZ13 IR camera"
        node.disabled = true
      }
    }
  }
]
