# ASUS ProArt PZ13: suspend the USB-C DisplayPort audio sinks as soon as they go idle.
# Install as ~/.config/wireplumber/wireplumber.conf.d/20-dp-audio.conf (or under
# /etc/wireplumber/wireplumber.conf.d/).
#
# When a monitor is unplugged, the msm DisplayPort driver reports the jack as unplugged
# and then waits up to 5 s for user space to close the audio stream before it tears the
# link down ("audio comp timeout" in dmesg when it gives up). PipeWire closes a sink's
# ALSA device only after the sink's idle timeout, whose default is also 5 s, so the
# driver usually loses that race, tears the link down under a running stream, and the
# next link training on that port fails until a reboot. A 1 s idle timeout on the two
# DisplayPort sinks closes the stream well inside the driver's wait.
#
# The higher session priority makes a plugged monitor the default output automatically
# (the speakers' priority is lower); choosing the speakers by hand while a monitor is
# attached still sticks, as WirePlumber stores that choice.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output\\..*HDMI.*"
        media.class = "Audio/Sink"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 1
        priority.session = 2000
      }
    }
  }
]
